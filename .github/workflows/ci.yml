name: CI

# Chạy mỗi khi push lên main hoặc mở Pull Request vào main.
# Mục tiêu: chặn bug trước khi lên production (test + build phải xanh).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # .npmrc có legacy-peer-deps=true → npm ci tự áp dụng
      - name: Install dependencies
        run: npm ci

      # Unit tests (jest). firestore.rules.test.ts đã bị loại khỏi đây
      # vì cần emulator — chạy riêng bằng `npm run test:rules`.
      - name: Run unit tests
        run: npm test

      # Build production — bắt lỗi type/compile trước khi deploy.
      # Dùng env giả: NEXT_PUBLIC_* chỉ cần tồn tại lúc build, không phải giá trị thật.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:cidummy"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-CIDUMMY000

  # Job riêng, KHÔNG chặn merge — chỉ báo cáo lỗ hổng dependency.
  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (informational)
        run: npm run security:audit
        continue-on-error: true
